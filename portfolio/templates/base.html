<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>document.documentElement.classList.add("has-js");</script>
</head>
<body data-page="{{ active or 'default' }}">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="mouse-glow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Abhinav Biju<span class="brand-dot">.</span></a>
    <nav class="site-nav">
      <a href="{{ url_for('home') }}" class="{{ 'is-active' if active == 'home' }}">Home</a>
      <a href="{{ url_for('projects') }}" class="{{ 'is-active' if active == 'projects' }}">Projects</a>
      <a href="{{ url_for('skills') }}" class="{{ 'is-active' if active == 'skills' }}">Skills</a>
      <a href="{{ url_for('certifications') }}" class="{{ 'is-active' if active == 'certifications' }}">Certifications</a>
      <a href="{{ url_for('links') }}" class="{{ 'is-active' if active == 'links' }}">Links</a>
      <a href="{{ url_for('about') }}" class="{{ 'is-active' if active == 'about' }}">About</a>
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Abhinav Biju</span>
    <span class="footer-sep">&middot;</span>
    <a href="https://www.linkedin.com/in/i-am-abhinav-biju/" target="_blank" rel="noopener">LinkedIn</a>
    <span class="footer-sep">&middot;</span>
    <a href="https://github.com/FTHZS" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="{{ url_for('static', filename='js/background.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mouse-glow.js') }}"></script>
  <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
